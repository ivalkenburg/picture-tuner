name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: picture-tuner-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  verify-patterns:
    name: Verify test patterns (bit-exact)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install Python dependencies
        run: pip install -r tools/requirements.txt
      - name: Decode every committed clip and compare with the generator
        run: python3 tools/generate_patterns.py --verify-only

  docker-tools:
    name: Docker toolchain (generate + verify sample patterns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build toolchain image
        run: docker build -t picture-tuner-tools -f tools/Dockerfile .
      - name: Generate sample families (static + Dolby Vision, finder ladder) and verify them
        run: |
          mkdir -p /tmp/out
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work" -v /tmp/out:/out picture-tuner-tools \
            python3 tools/generate_patterns.py /out --only black,peak --no-1080
      - name: Branding export checks
        run: docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/work" picture-tuner-tools python3 branding/export_android.py --check
